# Development stack.
#
#   docker compose up --build
#
# PostgreSQL (pgvector), Redis, the Django API, a Celery worker, the Next.js
# frontend, and the FastAPI AI engine. The backend container waits for
# PostgreSQL, applies migrations, and optionally seeds demo data before
# starting (see backend/entrypoint.sh).
#
# Secrets for local development live in the repository-root .env file.

x-backend-build: &backend-build
  context: .
  dockerfile: infrastructure/docker/dev/backend.Dockerfile

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.local
  DEBUG: "True"
  SECRET_KEY: ${SECRET_KEY:-local-dev-only-change-me-32-bytes-minimum-0001}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,0.0.0.0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres_admin}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-service_intel_db}
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  SEED_DEMO: ${SEED_DEMO:-true}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-service_intel_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_admin} -d ${POSTGRES_DB:-service_intel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sip_redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: *backend-build
    container_name: sip_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: *backend-build
    container_name: sip_celery_worker
    command: sh -c "pip install --no-cache-dir djangorestframework-simplejwt pyjwt && celery -A config worker -l INFO"
    volumes:
      - ./backend:/app
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/dev/frontend.Dockerfile
    container_name: sip_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_USE_DEV_BACKEND: ${NEXT_PUBLIC_USE_DEV_BACKEND:-true}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      - backend

  ai_engine:
    build:
      context: .
      dockerfile: ai-engine/Dockerfile
    container_name: sip_ai_engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data:
